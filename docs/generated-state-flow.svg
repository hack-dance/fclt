<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 617 1005" width="617" height="1005" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="308.5" y="40.75">Generated capability state</tspan></text><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_Request_Lock_0"><path d="M256.42,106L256.42,147"/><path class="pele-marker" d="M256.42,154L253.06,146L259.78,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Lock_Retry_0"><path d="M243.98,255.47C243.98,269.6 131.2,269.6 131.2,283.74L131.2,369.27"/><path class="pele-marker" d="M131.2,376.27L127.84,368.27L134.56,368.27Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Lock_Existing_0"><path d="M268.85,255.47C268.85,269.6 381.64,269.6 381.64,283.74L381.64,328.24"/><path class="pele-marker" d="M381.64,335.24L378.28,327.24L385,327.24Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Existing_Current_0"><path d="M359.69,450.58C359.69,467.68 264.22,467.68 264.22,484.79L264.22,529.29"/><path class="pele-marker" d="M264.22,536.29L260.86,528.29L267.58,528.29Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Existing_Legacy_0"><path d="M403.58,450.58C403.58,467.68 499.05,467.68 499.05,484.79L499.05,529.29"/><path class="pele-marker" d="M499.05,536.29L495.69,528.29L502.41,528.29Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Current_Build_0"><path d="M264.22,583.29L264.22,624.29"/><path class="pele-marker" d="M264.22,631.29L260.86,623.29L267.58,623.29Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Legacy_Build_0"><path d="M458.01,583.29C458.01,600.79 305.74,600.79 305.74,618.29L305.74,624.29"/><path class="pele-marker" d="M305.74,631.29L302.38,623.29L309.1,623.29Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Build_Graph_0"><path d="M272.22,695.29L272.22,736.29"/><path class="pele-marker" d="M272.22,743.29L268.86,735.29L275.58,735.29Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Graph_Index_0"><path d="M272.22,790.29L272.22,831.29"/><path class="pele-marker" d="M272.22,838.29L268.86,830.29L275.58,830.29Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Index_Unlock_0"><path d="M272.22,885.29L272.22,926.29"/><path class="pele-marker" d="M272.22,933.29L268.86,925.29L275.58,925.29Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Legacy_Preserve_0"><path d="M507.05,583.29L507.05,624.29" stroke-dasharray="3 4"/><path class="pele-marker" d="M507.05,631.29L503.69,623.29L510.41,623.29Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_Lock_Retry_0"><rect x="118.89" y="285.74" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="131.2" y="300.29" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_Lock_Existing_0"><rect x="366.44" y="285.74" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="381.64" y="300.29" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_Existing_Current_0"><rect x="249.02" y="486.79" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="264.22" y="501.34" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_Existing_Legacy_0"><rect x="486.74" y="486.79" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="499.05" y="501.34" text-anchor="middle">No</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Request" transform="translate(256.42,82.5)"><rect x="-60.94" y="-23.5" width="121.88" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Index rebuild</text></g><g class="pele-node pele-shape-diam" data-id="Lock" transform="translate(256.42,208.62)"><polygon points="0,-54.62 87.39,0 0,54.62 -87.39,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Writer lock free?</text></g><g class="pele-node pele-shape-rect" data-id="Retry" transform="translate(131.2,399.77)"><rect x="-107.2" y="-23.5" width="214.4" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Report busy; preserve files</text></g><g class="pele-node pele-shape-diam" data-id="Existing" transform="translate(381.64,399.77)"><polygon points="0,-64.53 103.24,0 0,64.53 -103.24,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Current index exists?</text></g><g class="pele-node pele-shape-rect" data-id="Current" transform="translate(264.22,559.79)"><rect x="-101.79" y="-23.5" width="203.58" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Read matching metadata</text></g><g class="pele-node pele-shape-rect" data-id="Legacy" transform="translate(499.05,559.79)"><rect x="-93.04" y="-23.5" width="186.08" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Read legacy metadata</text></g><g class="pele-node pele-shape-rect" data-id="Build" transform="translate(272.22,663.29)"><rect x="-85.52" y="-32" width="171.05" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Build from canonical</tspan><tspan x="0" y="15.25">assets</tspan></text></g><g class="pele-node pele-shape-rect" data-id="Graph" transform="translate(272.22,766.79)"><rect x="-100.11" y="-23.5" width="200.22" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Atomically replace graph</text></g><g class="pele-node pele-shape-rect" data-id="Index" transform="translate(272.22,861.79)"><rect x="-98.86" y="