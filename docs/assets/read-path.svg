<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 439 690" width="439" height="690" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="219.5" y="40.75">Prebuilt capability reads</tspan></text><g transform="translate(0,35)"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M140.46,38L140.46,99"/><path class="pele-marker" d="M140.46,106L137.1,98L143.82,98Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M140.46,149L140.46,210"/><path class="pele-marker" d="M140.46,217L137.1,209L143.82,209Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M140.46,260L140.46,297"/><path class="pele-marker" d="M140.46,304L137.1,296L143.82,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M140.46,347L140.46,408"/><path class="pele-marker" d="M140.46,415L137.1,407L143.82,407Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M140.46,458C140.46,467.25 61.26,467.25 61.26,476.5L61.26,519"/><path class="pele-marker" d="M61.26,526L57.9,518L64.61,518Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M140.46,458C140.46,467.25 171.6,467.25 171.6,476.5L171.6,519"/><path class="pele-marker" d="M171.6,526L168.24,518L174.96,518Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M140.46,458C140.46,466.59 299.88,467.91 299.88,476.5L299.88,519"/><path class="pele-marker" d="M299.88,526L296.52,518L303.24,518Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M61.26,569C61.26,584.5 171.6,584.5 171.6,600L171.6,606"/><path class="pele-marker" d="M171.6,613L168.24,605L174.96,605Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M171.6,569L171.6,606"/><path class="pele-marker" d="M171.6,613L168.24,605L174.96,605Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge9"><path d="M299.88,569C299.88,584.5 171.6,584.5 171.6,600L171.6,606"/><path class="pele-marker" d="M171.6,613L168.24,605L174.96,605Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="Validate-Validate----note-10"><path d="M183.56,436.5L227.56,436.5"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="edge0"><rect x="92.75" y="58.5" width="95.43" height="20" rx="3" fill="var(--_bg)"/><text x="140.46" y="73.05" text-anchor="middle">index or render</text></g><g class="pele-edge-label" data-id="edge1"><rect x="79.75" y="169.5" width="121.43" height="20" rx="3" fill="var(--_bg)"/><text x="140.46" y="184.05" text-anchor="middle">atomic replacement</text></g><g class="pele-edge-label" data-id="edge3"><rect x="81.91" y="367.5" width="117.11" height="20" rx="3" fill="var(--_bg)"/><text x="140.46" y="382.05" text-anchor="middle">recorded metadata</text></g><g class="pele-edge-label" data-id="edge4"><rect x="42.81" y="478.5" width="36.9" height="20" rx="3" fill="var(--_bg)"/><text x="61.26" y="493.05" text-anchor="middle">fresh</text></g><g class="pele-edge-label" data-id="edge5"><rect x="121.35" y="478.5" width="100.5" height="20" rx="3" fill="var(--_bg)"/><text x="171.6" y="493.05" text-anchor="middle">source changed</text></g><g class="pele-edge-label" data-id="edge6"><rect x="244.23" y="478.5" width="111.3" height="20" rx="3" fill="var(--_bg)"/><text x="299.88" y="493.05" text-anchor="middle">missing or corrupt</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(140.46,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Publish" transform="translate(140.46,127.5)"><rect x="-40.59" y="-21.5" width="81.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Publish</text></g><g class="pele-node pele-state" data-id="Snapshot" transform="translate(140.46,238.5)"><rect x="-47.69" y="-21.5" width="95.38" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Snapshot</text></g><g class="pele-node pele-state" data-id="Read" transform="translate(140.46,325.5)"><rect x="-33.92" y="-21.5" width="67.85" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Read</text></g><g class="pele-node pele-state" data-id="Result" transform="translate(61.26,547.5)"><rect x="-37.25" y="-21.5" width="74.51" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Result</text></g><g class="pele-node pele-state" data-id="Stale" transform="translate(171.6,547.5)"><rect x="-33.09" y="-21.5" width="66.19" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stale</text></g><g class="pele-node pele-state" data-id="Unavailable" transform="translate(299.88,547.5)"><rect x="-55.18" y="-21.5" width="110.36" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Unavailable</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(171.6,622)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Validate" transform="translate(140.46,436.5)"><rect x="-43.1" y="-21.5" width="86.2" height="43" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Validate</text></g><g class="pele-note" data-id="Validate----note-10" transform="translate(320.84,436.5)"><path d="M-93.28,-18H85.28L93.28,-10V18H-93.28Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M85.28,-18V-10H93.28" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="13" fill="var(--_m)" x="0" y="4.55" text-anchor="middle">Reads never rebuild or scan</text></g></g></g></svg>