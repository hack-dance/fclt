<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 555 831" width="555" height="831" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_Inspect_Registered_0"><path d="M194.94,71L194.94,112"/><path class="pele-marker" d="M194.94,119L191.58,111L198.3,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Registered_Unavailable_0"><path d="M173.99,232.88C173.99,249.68 92.02,249.68 92.02,266.48L92.02,340.12"/><path class="pele-marker" d="M92.02,347.12L88.66,339.12L95.38,339.12Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Registered_Evidence_0"><path d="M215.89,232.88C215.89,249.68 297.87,249.68 297.87,266.48L297.87,310.98"/><path class="pele-marker" d="M297.87,317.98L294.51,309.98L301.23,309.98Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Evidence_Unverified_0"><path d="M279.17,428.58C279.17,470.43 175.87,470.43 175.87,512.27L175.87,735.33"/><path class="pele-marker" d="M175.87,742.33L172.51,734.33L179.24,734.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Evidence_Validate_0"><path d="M316.57,428.58C316.57,444.68 404.11,444.68 404.11,460.77L404.11,505.27"/><path class="pele-marker" d="M404.11,512.27L400.75,504.27L407.47,504.27Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Validate_Unverified_0"><path d="M368.24,647.91C368.24,669.37 198.18,669.37 198.18,690.83L198.18,735.33"/><path class="pele-marker" d="M198.18,742.33L194.82,734.33L201.54,734.33Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Validate_Proven_0"><path d="M427.86,655.48L427.86,735.33"/><path class="pele-marker" d="M427.86,742.33L424.5,734.33L431.22,734.33Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_Registered_Unavailable_0"><rect x="79.71" y="268.48" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="92.02" y="283.03" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_Registered_Evidence_0"><rect x="282.67" y="268.48" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="297.87" y="283.03" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_Evidence_Unverified_0"><rect x="163.57" y="581.3" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="175.87" y="595.85" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_Evidence_Validate_0"><rect x="388.91" y="462.77" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="404.11" y="477.32" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_Validate_Unverified_0"><rect x="185.87" y="692.83" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="198.18" y="707.38" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_Validate_Proven_0"><rect x="412.66" y="692.83" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="427.86" y="707.38" text-anchor="middle">Yes</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Inspect" transform="translate(194.94,47.5)"><rect x="-81.36" y="-23.5" width="162.72" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Inspect registration</text></g><g class="pele-node pele-shape-diam" data-id="Registered" transform="translate(194.94,182.49)"><polygon points="0,-63.49 101.58,0 0,63.49 -101.58,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Registered payload?</text></g><g class="pele-node pele-shape-rect" data-id="Unavailable" transform="translate(92.02,379.12)"><rect x="-68.02" y="-32" width="136.04" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Not installed or</tspan><tspan x="0" y="15.25">misconfigured</tspan></text></g><g class="pele-node pele-shape-diam" data-id="Evidence" transform="translate(297.87,379.12)"><polygon points="0,-61.15 97.83,0 0,61.15 -97.83,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Evidence supplied?</text></g><g class="pele-node pele-shape-rect wait" data-id="Unverified" transform="translate(183.87,765.83)"><rect x="-103.45" y="-23.5" width="206.91" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Registered and unverified</text></g><g class="pele-node pele-shape-diam" data-id="Validate" transform="translate(404.11,591.3)"><polygon points="0,-79.03 126.45,0 0,79.03 -126.45,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Session, snapshot, age,</tspan><tspan x="0" y="15.25">tools match?</tspan></text></g><g class="pele-node pele-shape-rect ok" data-id="Proven" transform="translate(427.86,774.33)"><rect x="-100.53" y="-32" width="201.06" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Externally proven for this</tspan><tspan x="0" y="15.25">session</tspan></text></g></g></svg>