<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 311 852" width="311" height="852" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_Choose_Recipe_0"><path d="M194.08,71L194.08,112"/><path class="pele-marker" d="M194.08,119L190.72,111L197.44,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Recipe_Edit_0"><path d="M194.08,166L194.08,207"/><path class="pele-marker" d="M194.08,214L190.72,206L197.44,206Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Edit_Preview_0"><path d="M123.28,261L123.28,302"/><path class="pele-marker" d="M123.28,309L119.92,301L126.64,301Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Preview_Diagnose_0"><path d="M123.28,356L123.28,397"/><path class="pele-marker" d="M123.28,404L119.92,396L126.64,396Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Diagnose_Ready_0"><path d="M123.28,451C123.28,471 186.08,471 186.08,491L186.08,497"/><path class="pele-marker" d="M186.08,504L182.72,496L189.44,496Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Ready_Edit_0"><path d="M202.08,504L202.08,491C202.08,471 264.88,471 264.88,451L264.88,268"/><path class="pele-marker" d="M264.88,261L268.24,269L261.52,269Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Ready_Reconcile_0"><path d="M194.08,596.8L194.08,661.8"/><path class="pele-marker" d="M194.08,668.8L190.72,660.8L197.44,660.8Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Reconcile_Evidence_0"><path d="M194.08,732.8L194.08,773.8"/><path class="pele-marker" d="M194.08,780.8L190.72,772.8L197.44,772.8Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_Ready_Edit_0"><rect x="252.57" y="417.5" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="264.88" y="432.05" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_Ready_Reconcile_0"><rect x="178.88" y="619.3" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="194.08" y="633.85" text-anchor="middle">Yes</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Choose" transform="translate(194.08,47.5)"><rect x="-90.94" y="-23.5" width="181.89" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Choose explicit inputs</text></g><g class="pele-node pele-shape-rect" data-id="Recipe" transform="translate(194.08,142.5)"><rect x="-92.62" y="-23.5" width="185.24" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Generate source entry</text></g><g class="pele-node pele-shape-rect" data-id="Edit" transform="translate(194.08,237.5)"><rect x="-87.61" y="-23.5" width="175.22" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Review configuration</text></g><g class="pele-node pele-shape-rect" data-id="Preview" transform="translate(123.28,332.5)"><rect x="-86.77" y="-23.5" width="173.55" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Preview read targets</text></g><g class="pele-node pele-shape-rect wait" data-id="Diagnose" transform="translate(123.28,427.5)"><rect x="-99.28" y="-23.5" width="198.57" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Inspect recorded checks</text></g><g class="pele-node pele-shape-diam" data-id="Ready" transform="translate(194.08,547.9)"><polygon points="0,-48.9 78.24,0 0,48.9 -78.24,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Inputs ready?</text></g><g class="pele-node pele-shape-rect" data-id="Reconcile" transform="translate(194.08,700.8)"><rect x="-63.03" y="-32" width="126.06" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Run bounded</tspan><tspan x="0" y="15.25">reconciliation</tspan></text></g><g class="pele-node pele-shape-rect ok" data-id="Evidence" transform="translate(194.08,804.3)"><rect x="-90.94" y="-23.5" width="181.89" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Record new coverage</text></g></g></svg>