<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 461 1295" width="461" height="1295" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="230.5" y="40.75">Writeback reconciliation</tspan></text><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_paths_order_0"><path d="M230.06,123L230.06,164"/><path class="pele-marker" d="M230.06,171L226.7,163L233.42,163Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_order_queue_0"><path d="M230.06,218L230.06,259"/><path class="pele-marker" d="M230.06,266L226.7,258L233.42,258Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_queue_window_0"><path d="M230.06,313L230.06,354"/><path class="pele-marker" d="M230.06,361L226.7,353L233.42,353Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_window_latest_0"><path d="M230.06,425L230.06,466"/><path class="pele-marker" d="M230.06,473L226.7,465L233.42,465Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_latest_tie_0"><path d="M230.06,520L230.06,561"/><path class="pele-marker" d="M230.06,568L226.7,560L233.42,560Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_tie_append_0"><path d="M217.38,669.84C217.38,684.05 168.02,684.05 168.02,698.27L168.02,742.77"/><path class="pele-marker" d="M168.02,749.77L164.66,741.77L171.38,741.77Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_tie_selected_0"><path d="M242.75,669.84C242.75,709.8 292.11,709.8 292.11,749.77L292.11,796.77C292.11,814.27 239.41,814.27 239.41,831.77L239.41,837.77"/><path class="pele-marker" d="M239.41,844.77L236.05,836.77L242.77,836.77Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_append_selected_0"><path d="M168.02,796.77C168.02,814.27 220.71,814.27 220.71,831.77L220.71,837.77"/><path class="pele-marker" d="M220.71,844.77L217.35,836.77L224.07,836.77Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_selected_context_0"><path d="M230.06,891.77L230.06,932.77"/><path class="pele-marker" d="M230.06,939.77L226.7,931.77L233.42,931.77Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_context_excluded_0"><path d="M214.12,1046.35C214.12,1061.59 117.04,1061.59 117.04,1076.82L117.04,1121.32"/><path class="pele-marker" d="M117.04,1128.32L113.68,1120.32L120.4,1120.32Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_context_kind_0"><path d="M246.01,1046.35C246.01,1061.59 343.09,1061.59 343.09,1076.82L343.09,1121.32"/><path class="pele-marker" d="M343.09,1128.32L339.73,1120.32L346.45,1120.32Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_kind_report_0"><path d="M343.09,1175.32L343.09,1216.32"/><path class="pele-marker" d="M343.09,1223.32L339.73,1215.32L346.45,1215.32Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_tie_append_0"><rect x="152.82" y="700.27" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="168.02" y="714.82" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_tie_selected_0"><rect x="279.8" y="763.27" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="292.11" y="777.82" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_context_excluded_0"><rect x="104.73" y="1078.82" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="117.04" y="1093.37" text-anchor="middle">No</text></g><g class="pele-edge-label" data-id="L_context_kind_0"><rect x="327.89" y="1078.82" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="343.09" y="1093.37" text-anchor="middle">Yes</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="paths" transform="translate(230.06,91)"><rect x="-82.2" y="-32" width="164.4" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Legacy and current</tspan><tspan x="0" y="15.25">queues</tspan></text></g><g class="pele-node pele-shape-rect" data-id="order" transform="translate(230.06,194.5)"><rect x="-94.69" y="-23.5" width="189.39" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Shared migration order</text></g><g class="pele-node pele-shape-rect" data-id="queue" transform="translate(230.06,289.5)"><rect x="-106.78" y="-23.5" width="213.56" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Append-only lifecycle rows</text></g><g class="pele-node pele-shape-rect" data-id="window" transform="translate(230.06,393)"><rect x="-80.95" y="-32" width="161.89" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Keep rows through</tspan><tspan x="0" y="15.25">window end</tspan></text></g><g class="pele-node pele-shape-rect" data-id="latest" transform="translate(230.06,496.5)"><rect x="-102.19" y="-23.5" width="204.38" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Newest timestamp per ID</text></g><g class="pele-node pele-shape-diam" data-id="tie" transform="translate(230.06,622.88)"><polygon points="0,-54.88 87.81,0 0,54.88 -87.81,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Timestamps tie?</text></g><g class="pele-node pele-shape-rect" data-id="append" transform="translate(168.02,773.27)"><rect x="-81.79" y="-23.5" width="163.57" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Last appended row</text></g><g class="pele-node pele-shape-rect" data-id="selected" transform="translate(230.06,868.27)"><rect x="-61.35" y="-23.5" width="122.7" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Selected row</text></g><g class="pele-node pele-shape-diam" data-id="context" transform="translate(230.06,998.04)"><polygon points="0,-58.28 93.24,0 0,58.28 -93.24,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Context matches?</text></g><g class="pele-node pele-shape-rect" data-id="excluded" transform="translate(117.04,1151.82)"><rect x="-93.04" y="-23.5" width="186.08" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Exclude selected state</text></g><g class="pele-node pele-shape-rect" data-id="kind" transform="translate(343.09,1151.82)"><rect x="-93.01" y="-23.5" width="186.03" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Normalize kind aliases</text></g><g class="pele-node pele-shape-rect" data-id="report" transform="translate(343.09,1246.82)"><rect x="-73.03" y="-23.5" width="146.06" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">One state per ID</text></g></g></svg>