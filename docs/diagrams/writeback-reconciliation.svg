<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 299 899" width="299" height="899" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="149.5" y="40.75">Writeback reconciliation</tspan></text><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_queue_window_0"><path d="M167.83,106L167.83,147"/><path class="pele-marker" d="M167.83,154L164.47,146L171.19,146Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_window_latest_0"><path d="M167.83,218L167.83,259"/><path class="pele-marker" d="M167.83,266L164.47,258L171.19,258Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_latest_tie_0"><path d="M167.83,313L167.83,354"/><path class="pele-marker" d="M167.83,361L164.47,353L171.19,353Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_tie_append_0"><path d="M155.15,462.84C155.15,477.05 105.79,477.05 105.79,491.27L105.79,535.77"/><path class="pele-marker" d="M105.79,542.77L102.43,534.77L109.15,534.77Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_tie_selected_0"><path d="M180.52,462.84C180.52,502.8 229.88,502.8 229.88,542.77L229.88,589.77C229.88,607.27 177.18,607.27 177.18,624.77L177.18,630.77"/><path class="pele-marker" d="M177.18,637.77L173.82,629.77L180.54,629.77Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_append_selected_0"><path d="M105.79,589.77C105.79,607.27 158.48,607.27 158.48,624.77L158.48,630.77"/><path class="pele-marker" d="M158.48,637.77L155.12,629.77L161.84,629.77Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_selected_kind_0"><path d="M167.83,684.77L167.83,725.77"/><path class="pele-marker" d="M167.83,732.77L164.47,724.77L171.19,724.77Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_kind_report_0"><path d="M167.83,779.77L167.83,820.77"/><path class="pele-marker" d="M167.83,827.77L164.47,819.77L171.19,819.77Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_tie_append_0"><rect x="90.59" y="493.27" width="30.4" height="20" rx="3" fill="var(--_bg)"/><text x="105.79" y="507.82" text-anchor="middle">Yes</text></g><g class="pele-edge-label" data-id="L_tie_selected_0"><rect x="217.58" y="556.27" width="24.61" height="20" rx="3" fill="var(--_bg)"/><text x="229.88" y="570.82" text-anchor="middle">No</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="queue" transform="translate(167.83,82.5)"><rect x="-106.78" y="-23.5" width="213.56" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Append-only lifecycle rows</text></g><g class="pele-node pele-shape-rect" data-id="window" transform="translate(167.83,186)"><rect x="-80.95" y="-32" width="161.89" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">Keep rows through</tspan><tspan x="0" y="15.25">window end</tspan></text></g><g class="pele-node pele-shape-rect" data-id="latest" transform="translate(167.83,289.5)"><rect x="-102.19" y="-23.5" width="204.38" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Newest timestamp per ID</text></g><g class="pele-node pele-shape-diam" data-id="tie" transform="translate(167.83,415.88)"><polygon points="0,-54.88 87.81,0 0,54.88 -87.81,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Timestamps tie?</text></g><g class="pele-node pele-shape-rect" data-id="append" transform="translate(105.79,566.27)"><rect x="-81.79" y="-23.5" width="163.57" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Last appended row</text></g><g class="pele-node pele-shape-rect" data-id="selected" transform="translate(167.83,661.27)"><rect x="-61.35" y="-23.5" width="122.7" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Selected row</text></g><g class="pele-node pele-shape-rect" data-id="kind" transform="translate(167.83,756.27)"><rect x="-93.01" y="-23.5" width="186.03" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Normalize kind aliases</text></g><g class="pele-node pele-shape-rect" data-id="report" transform="translate(167.83,851.27)"><rect x="-73.03" y="-23.5" width="146.06" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">One state per ID</text></g></g></svg>