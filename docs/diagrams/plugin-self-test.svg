<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 700 706" width="700" height="706" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,Geist Mono);font:15px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Geist)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" data-theme="light"><style><![CDATA[/* Hack Dance house theme for Pele 1.9.x: ink on cream (fleet palette B). Light by default; dark via [data-theme=dark].
   Colour only for meaning (house classes). Never resize label text: Pele sized label boxes for its own font size. */
.pele {
  --pele-font: "Geist", ui-sans-serif, system-ui, sans-serif;
  --pele-font-mono: "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
  --pele-bg: #F3EFE3;
  --pele-fg: #1D1D1B;
  --pele-muted: #3D3C37;
  --pele-line: #3D3C37;
  --pele-surface: #FBF9F1;
  --pele-surface-alt: #E8E4D8;
  --pele-border: #66625A;
  --pele-accent: #1D1D1B;
  --pele-critical: #C2461F;
  --pele-error: #C2461F;
  --pele-radius: 8px;
  --pele-title-weight: 600;
  --pele-heading-weight: 600;
  --pele-bold-weight: 600;
  --pele-series-1: #5b3df5; --pele-series-2: #0e9f8a; --pele-series-3: #e08a00; --pele-series-4: #d6345a;
  --pele-series-5: #2f7de1; --pele-series-6: #8a5cf6; --pele-series-7: #4f9d2d; --pele-series-8: #a0674b;
  /* semantic state tints (house classes) */
  --hd-live: #4B4790;  --hd-live-bg: #E6E4F0;
  --hd-wait: #34506E;  --hd-wait-bg: #D3DBE5;
  --hd-ok:   #3A7A2E;  --hd-ok-bg:   #E2EBD9;
  --hd-fail: #C2461F;  --hd-fail-bg: #F5E0D6;
  --hd-idle: #8A8576;  --hd-idle-bg: #E8E4D8;
  background: var(--pele-bg);
}
.pele[data-theme="dark"], [data-theme="dark"] .pele {
  --pele-bg: #11100E;
  --pele-fg: #EDE8D9;
  --pele-muted: #C9C3B2;
  --pele-line: #C9C3B2;
  --pele-surface: #191815;
  --pele-surface-alt: #1B1A17;
  --pele-border: #8F897A;
  --pele-accent: #EDE8D9;
  --pele-critical: #FF7A52;
  --pele-error: #FF7A52;
  --pele-series-1: #9a86ff; --pele-series-2: #3fd1b8; --pele-series-3: #ffb547; --pele-series-4: #ff6b8b;
  --pele-series-5: #6aa8ff; --pele-series-6: #c4a5ff; --pele-series-7: #8fd16a; --pele-series-8: #d29b7f;
  --hd-live: #A39CE0;  --hd-live-bg: #24223A;
  --hd-wait: #9DB4CF;  --hd-wait-bg: #22303D;
  --hd-ok:   #7CC25E;  --hd-ok-bg:   #1C2A17;
  --hd-fail: #FF7A52;  --hd-fail-bg: #33190F;
  --hd-idle: #7A7466;  --hd-idle-bg: #1B1A17;
}
/* polish */
.pele .pele-edge path { stroke-width: 1.4px; stroke-linecap: round; }
.pele .pele-edge-label rect { fill: var(--pele-bg); }
.pele .pele-edge-label text { fill: var(--pele-muted); }
.pele .pele-cluster-label, .pele .pele-title { letter-spacing: .01em; }
.pele .pele-node > rect, .pele .pele-node > path, .pele .pele-node > polygon, .pele .pele-node > circle, .pele .pele-node > ellipse { stroke-width: 1.2px; }
/* house semantic classes: in Mermaid write `classDef live stroke-width:1.6px` + `class X live` */
.pele .live > rect, .pele .live > path, .pele .live > polygon, .pele .live > circle, .pele .live > ellipse { fill: var(--hd-live-bg) !important; stroke: var(--hd-live) !important; }
.pele .wait > rect, .pele .wait > path, .pele .wait > polygon, .pele .wait > circle, .pele .wait > ellipse { fill: var(--hd-wait-bg) !important; stroke: var(--hd-wait) !important; }
.pele .ok   > rect, .pele .ok   > path, .pele .ok   > polygon, .pele .ok > circle, .pele .ok > ellipse { fill: var(--hd-ok-bg)   !important; stroke: var(--hd-ok)   !important; }
.pele .fail > rect, .pele .fail > path, .pele .fail > polygon, .pele .fail > circle, .pele .fail > ellipse { fill: var(--hd-fail-bg) !important; stroke: var(--hd-fail) !important; }
.pele .idle > rect, .pele .idle > path, .pele .idle > polygon, .pele .idle > circle, .pele .idle > ellipse { fill: var(--hd-idle-bg) !important; stroke: var(--hd-idle) !important; stroke-dasharray: 4 3; }
.pele .live .pele-label { fill: var(--hd-live); font-weight: 600; }
.pele .wait .pele-label { fill: var(--hd-wait); font-weight: 600; }
.pele .ok   .pele-label { fill: var(--hd-ok);   font-weight: 600; }
.pele .fail .pele-label { fill: var(--hd-fail); font-weight: 600; }
.pele .idle .pele-label { fill: var(--hd-idle); }
]]></style><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_Fixture_Boundary_0"><path d="M242.77,71L242.77,112"/><path class="pele-marker" d="M242.77,119L239.4,111L246.13,111Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Boundary_Render_0"><path d="M242.77,166L242.77,207"/><path class="pele-marker" d="M242.77,214L239.4,206L246.13,206Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Render_Spawn_0"><path d="M242.77,261L242.77,302"/><path class="pele-marker" d="M242.77,309L239.4,301L246.13,301Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Spawn_Resolve_0"><path d="M205.91,356C205.91,377.75 126.61,377.75 126.61,399.5L126.61,405.5"/><path class="pele-marker" d="M126.61,412.5L123.25,404.5L129.97,404.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Resolve_Stop_0"><path d="M126.61,459.5C126.61,493.25 308.72,493.25 308.72,527L308.72,533"/><path class="pele-marker" d="M308.72,540L305.36,532L312.08,532Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Stop_Success_0"><path d="M354.35,587L354.35,628"/><path class="pele-marker" d="M354.35,635L350.99,627L357.71,627Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Spawn_Failure_0"><path d="M279.62,356C279.62,373.5 358.92,373.5 358.92,391L358.92,397"/><path class="pele-marker" d="M358.92,404L355.56,396L362.28,396Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_Parent_Stop_0"><path d="M582.09,459.5L582.09,512.5C582.09,517.69 399.98,522.68 399.98,527.88L399.98,533" stroke-dasharray="3 4"/><path class="pele-marker" d="M399.98,540L396.61,532L403.34,532Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="L_Parent_Stop_0"><rect x="514.5" y="490.5" width="135.18" height="20" rx="3" fill="var(--_bg)"/><text x="582.09" y="505.05" text-anchor="middle">excluded by boundary</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="Fixture" transform="translate(242.77,47.5)"><rect x="-87.61" y="-23.5" width="175.23" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Isolated fixture home</text></g><g class="pele-node pele-shape-rect" data-id="Boundary" transform="translate(242.77,142.5)"><rect x="-80.95" y="-23.5" width="161.89" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Valid package.json</text></g><g class="pele-node pele-shape-rect" data-id="Render" transform="translate(242.77,237.5)"><rect x="-88.45" y="-23.5" width="176.9" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Render Codex plugin</text></g><g class="pele-node pele-shape-rect" data-id="Spawn" transform="translate(242.77,332.5)"><rect x="-88.85" y="-23.5" width="177.71" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Node child: --self-test</text></g><g class="pele-node pele-shape-rect" data-id="Resolve" transform="translate(126.61,436)"><rect x="-102.61" y="-23.5" width="205.22" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Resolve runtime modules</text></g><g class="pele-node pele-shape-rect" data-id="Stop" transform="translate(354.35,563.5)"><rect x="-97.63" y="-23.5" width="195.26" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Stop at fixture boundary</text></g><g class="pele-node pele-shape-rect" data-id="Success" transform="translate(354.35,658.5)"><rect x="-90.12" y="-23.5" width="180.24" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Exit 0 and tool names</text></g><g class="pele-node pele-shape-rect" data-id="Failure" transform="translate(358.92,436)"><rect x="-89.71" y="-32" width="179.42" height="64" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.75">On failure: stdout and</tspan><tspan x="0" y="15.25">stderr</tspan></text></g><g class="pele-node pele-shape-rect" data-id="Parent" transform="translate(582.09,436)"><rect x="-93.46" y="-23.5" width="186.92" height="47" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.25" text-anchor="middle">Invalid parent package</text></g></g></svg>